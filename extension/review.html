<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Crate Digger: check before downloading</title>
  <link rel="icon" href="icons/icon48.png">
  <link rel="stylesheet" href="review.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/icon48.png" alt=""><span>Check before downloading</span></div>
    <h1 id="plName">Playlist</h1>
    <p class="lead">This is exactly what Soulseek will search for. Fix any names that look wrong, untick anything you don’t want, then press <b>⬇ Download</b>. Edits are saved to your playlist.</p>
    <div id="conn" class="conn hidden"></div>
    <div id="tidyNote" class="note hidden"></div>
    <div class="filters" role="tablist">
      <button data-f="all" class="on">All <span id="cAll"></span></button>
      <button data-f="check">⚠ Needs a look <span id="cCheck"></span></button>
      <button data-f="todo">Not downloaded <span id="cTodo"></span></button>
    </div>
  </header>

  <main>
    <table id="grid">
      <thead>
        <tr>
          <th class="c-inc"><input type="checkbox" id="incAll" title="Tick / untick all shown"></th>
          <th class="c-num">#</th>
          <th class="c-st">Status</th>
          <th class="c-a">Artist</th>
          <th class="c-t">Title <span class="muted">(keep the mix name)</span></th>
          <th class="c-q">Soulseek will search</th>
          <th class="c-x"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty hidden">Nothing to show here.</div>
    <div id="done" class="done hidden"></div>
  </main>

  <footer class="bar">
    <label class="q"><span class="lbl">Quality</span><select id="quality"></select></label>
    <div class="into"><span class="lbl">Into</span><code id="folder"></code></div>
    <label class="skip"><input type="checkbox" id="skipNext"> Skip this page next time</label>
    <span class="grow"></span>
    <button id="saveBtn" class="ghost" title="Save the names to your playlist without downloading">Save names</button>
    <button id="goBtn" class="primary">⬇ Download</button>
  </footer>
  <div id="snack" class="snack hidden"></div>

  <script src="storage.js"></script>
  <script src="sockseek.js"></script>
  <script src="review.js"></script>
</body>
</html>
